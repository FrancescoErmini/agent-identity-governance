<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo-crm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">demo-crm <span class="muted">synthetic data</span></div>
  <div id="who" class="who"></div>
</header>

<main id="login-view" class="center" hidden>
  <h1>demo-crm</h1>
  <p class="muted">Sign in with Keycloak. You will be asked to let the assistant act on your behalf.</p>
  <button id="login" class="primary">Sign in</button>
  <p class="muted small">Users: luca, giulia, marco. Password = username.</p>
</main>

<main id="app-view" class="grid" hidden>
  <section class="card">
    <h2>Accounts <span id="territory" class="pill"></span></h2>
    <input id="q" placeholder="Search name or city">
    <ul id="accounts" class="list"></ul>
  </section>

  <section class="card">
    <h2 id="acc-title">Select an account</h2>
    <div id="acc-detail" class="muted">Pick an account on the left.</div>
    <div id="acc-actions" class="actions" hidden>
      <button data-task="summary" class="primary">Assistant: prepare visit and draft a note</button>
      <button data-task="team_report">Assistant: team report</button>
      <button data-task="forbidden_tool" class="ghost">Assistant: try a tool it doesn't have</button>
      <button data-task="final_note" class="ghost">Assistant: try a final note</button>
      <button data-task="bypass_gateway" class="ghost">Assistant: bypass the gateway</button>
    </div>
    <div id="transcript"></div>
  </section>

  <section class="card">
    <h2>My notes</h2>
    <ul id="notes" class="list"></ul>
    <h2>Reminders <button id="run-dq" class="small ghost" title="Stands in for the nightly scheduler">Run agent-dq now</button></h2>
    <ul id="reminders" class="list"></ul>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
