# LiteLLM open source. Admission by Keycloak token through the custom_auth hook in
# keycloak_auth.py. With the Enterprise trial, switch to enable_jwt_auth (see README).
model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: demo-mock                      # canned answer, no provider: lets the checks run without a model key
    litellm_params:
      model: openai/demo-mock
      api_key: not-used
      mock_response: "ok"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  custom_auth: keycloak_auth.user_api_key_auth
  custom_auth_run_common_checks: true          # team, model and budget checks still apply

litellm_settings:
  enable_post_custom_auth_checks: true
