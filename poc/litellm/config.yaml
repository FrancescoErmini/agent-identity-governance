# LiteLLM open source. Admission by Keycloak token through the custom_auth hook in
# keycloak_auth.py. With the Enterprise trial, switch to enable_jwt_auth (see README).
model_list:
  - model_name: gpt                            # OpenAI: set OPENAI_API_KEY in .env and LLM_MODEL=gpt
    litellm_params:
      model: openai/gpt-4.1-mini               # change to any chat model your key can use
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet                  # Anthropic: set ANTHROPIC_API_KEY and LLM_MODEL=claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: demo-mock                      # canned answer, no provider: lets the checks run without a model key
    litellm_params:
      model: openai/demo-mock
      api_key: not-used
      mock_response: "ok"

mcp_servers:
  demo_crm:
    url: "http://demo-crm-mcp:8000/mcp"
    transport: "http"
    auth_type: oauth_delegate      # LiteLLM admits the caller, forwards the caller's bearer upstream
    extra_headers: ["x-correlation-id"]   # one id from the request in the UI to the record in demo-crm

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  custom_auth: keycloak_auth.user_api_key_auth
  custom_auth_run_common_checks: true          # team, model and budget checks still apply

litellm_settings:
  enable_post_custom_auth_checks: true
